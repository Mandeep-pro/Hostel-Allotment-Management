<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Manasbal &amp; Mansar Hostel Allotment{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='site.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ url_for('welcome_page') }}">Manasbal &amp; Mansar <span>Hostel Allotment</span></a>
    <nav><a href="{{ url_for('welcome_page') }}">Welcome</a><a href="{{ url_for('student_registration') }}">Register</a><a href="{{ url_for('my_allotment') }}">My allotment</a></nav>
  </header>
  <main class="page-content">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}<div class="alert {{ category }}">{{ message }}</div>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
